<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Marchesini Pro v10.2</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a0d1a 0%, #121526 100%);
      --glass-card: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(212, 175, 55, 0.25);
      --accent: #d4af37; /* Ouro Nobre */
      --accent-glow: rgba(212, 175, 55, 0.4);
      --text: #ffffff;
      --muted: #8fa0b5;
      --success: #2ecc71;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background: var(--bg-gradient); 
      color: var(--text); 
      padding: 20px 16px 60px 16px; /* Padding menor e limpo sem nada obstruindo */
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Topo de Luxo com Botão de Chat Embutido */
    .app-header {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.01);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      position: relative;
    }
    .logo-wrapper { position: relative; width: 54px; height: 54px; margin-right: 14px; cursor: pointer; }
    .app-logo { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; border: 2px solid var(--accent); }
    .logo-hint { position: absolute; bottom: -4px; right: -4px; background: var(--accent); font-size: 8px; padding: 1px 4px; border-radius: 4px; color: #000; font-weight: 900; }
    .app-info { flex: 1; }
    .app-info h1 { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
    .app-info p { font-size: 9px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    
    /* Botão Flutuante do Chat no Menu Superior */
    .btn-open-chat {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 18px;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-open-chat:active { transform: scale(0.9); }

    /* Barra de Progresso Premium */
    .progress-box { background: rgba(0, 0, 0, 0.2); padding: 14px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.03); }
    .progress-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin-bottom: 8px; color: var(--muted); }
    .progress-bar-bg { background: rgba(255,255,255,0.05); height: 6px; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px var(--accent-glow); }

    /* Seção de Equipe */
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin: 15px 0 10px 4px; }
    .section-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; }
    .btn-add-member { background: transparent; border: 1px dashed var(--accent); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 6px; cursor: pointer; font-weight: 700; }

    .team-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 4px 10px 4px; width: 100%; }
    .team-scroll::-webkit-scrollbar { display: none; }
    
    .team-card { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
    .avatar-wrapper { position: relative; width: 56px; height: 56px; }
    
    /* Imagens e Letras redondas */
    .team-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); background: #16192e; transition: all 0.3s ease; }
    .team-avatar-placeholder { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); background: #16192e; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: var(--accent); transition: all 0.3s ease; }
    
    .team-name { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; white-space: nowrap; }
    .btn-profile-cam { position: absolute; bottom: 0; right: 0; background: var(--accent); border: none; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 10; }
    
    .team-card.active .team-avatar, .team-card.active .team-avatar-placeholder { border-color: var(--accent); transform: scale(1.05); box-shadow: 0 0 12px var(--accent-glow); }
    .team-card.active .team-name { color: #fff; font-weight: 700; }

    /* Setores */
    .sector-card { background: var(--glass-card); border: 1px solid rgba(255,255,255,0.04); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; margin-bottom: 12px; overflow: hidden; }
    .sector-card.active { border-color: rgba(212, 175, 55, 0.15); }
    .sector-header { display: flex; align-items: center; padding: 16px; cursor: pointer; }
    .sector-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.02); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; }
    .sector-details { flex: 1; }
    .sector-name { font-size: 14px; font-weight: 700; color: #fff; }
    .sector-qty { font-size: 11px; color: var(--muted); }
    .chevron { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 3; transition: transform 0.3s; }
    .sector-card.active .chevron { transform: rotate(180deg); stroke: var(--accent); }
    .sector-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
    
    /* Itens de Tarefa */
    .task-item { display: flex; flex-direction: column; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.02); background: rgba(0,0,0,0.08); }
    .task-main-row { display: flex; align-items: center; width: 100%; cursor: pointer; }
