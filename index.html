<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Checklist Premium Dynamic v11.0</title>
  <style>
    /* Nova Identidade Visual: Design de App Nativo iOS/Android */
    :root {
      --bg: #0b0e14;
      --card-bg: #131722;
      --card-hover: #1c2130;
      --border: rgba(255, 255, 255, 0.05);
      --accent: #d4af37; /* Ouro Inicial */
      --accent-rgb: 212, 175, 55;
      --text: #f5f6f9;
      --muted: #7e8494;
      --success: #34c759;
      --danger: #ff453a;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      padding: 24px 16px 120px 16px; 
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Topo Totalmente Customizável e Repaginado */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .header-left { display: flex; align-items: center; gap: 14px; flex: 1; }

    .logo-wrapper { position: relative; width: 56px; height: 56px; cursor: pointer; flex-shrink: 0; }
    .app-logo { width: 100%; height: 100%; border-radius: 16px; object-fit: cover; border: 2px solid var(--accent); }
    .logo-hint { position: absolute; bottom: -2px; right: -2px; background: var(--accent); font-size: 8px; padding: 2px 4px; border-radius: 4px; color: #000; font-weight: 800; text-transform: uppercase; }

    .app-info { flex: 1; }
    .app-info h1 { font-size: 18px; font-weight: 700; color: #fff; cursor: pointer; display: inline-block; }
    .app-info h1:hover { text-decoration: underline; color: var(--accent); }
    .app-info p { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    .menu-toggle {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--accent); width: 44px; height: 44px; border-radius: 12px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    /* Painel de Configuração Temática Dinâmica (Para Venda) */
    .setup-panel {
      background: linear-gradient(135deg, #1a1f2c, #131722);
      border: 2px solid var(--accent);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      display: none; /* Abre pelo menu ou clicando no nome */
    }
    .setup-panel h3 { font-size: 15px; color: var(--accent); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .setup-grid { display: flex; flex-direction: column; gap: 12px; }
    .setup-field { display: flex; flex-direction: column; gap: 6px; }
    .setup-field label { font-size: 12px; font-weight: 600; color: var(--muted); }
    .setup-input { padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 14px; }
    .setup-input:focus { outline: none; border-color: var(--accent); }
    .color-presets { display: flex; gap: 10px; margin-top: 4px; }
    .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.active { border-color: #fff; transform: scale(1.1); }

    /* Barra de Progresso Arredondada */
    .progress-box {
      background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 16px; margin-bottom: 24px;
    }
    .progress-labels { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--muted); }
    .progress-bar-bg { background: rgba(255, 255, 255, 0.03); height: 10px; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.02); }
    .progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; width: 0%; transition: width 0.5s ease; }

    /* Grid/Scroll de Equipe */
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.8px; }
    .btn-add-member { background: rgba(255,255,255,0.03); border: 1px dashed var(--accent); color: var(--accent); font-size: 11px; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; }
    
    .team-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; -webkit-overflow-scrolling: touch; }
    .team-scroll::-webkit-scrollbar { display: none; }
    .team-card { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
    
    .avatar-wrapper { position: relative; width: 58px; height: 58px; }
    .team-avatar { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 2.5px solid rgba(255,255,255,0.1); background: #16161e; transition: all 0.2s ease; }
    .team-avatar-placeholder { width: 58px; height: 58px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; transition: all 0.2s ease; }
    .team-name { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; white-space: nowrap; }
    
    .btn-profile-cam { position: absolute; bottom: -2px; right: -2px; background: var(--accent); border: none; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.4); z-index: 10; }
    
    .team-card.active .team-avatar { border-color: var(--accent) !important; transform: scale(1.05); box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.3); }
    .team-card.active .team-avatar-placeholder { background: var(--accent) !important; color: #000 !important; border-color: var(--accent) !important; transform: scale(1.05); font-weight: 800; }
    .team-card.active .team-name { color: #fff; font-weight: 700; }

    /* Setores Clean Design */
    .sector-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 12px; overflow: hidden; transition: border-color 0.2s;
    }
    .sector-header { display: flex; align-items: center; padding: 16px; cursor: pointer; user-select: none; }
    .sector-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.03); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; }
    .sector-details { flex: 1; }
    .sector-name { font-size: 15px; font-weight: 600; }
    .sector-qty { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .chevron { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2.5; transition: transform 0.25s; }
    
    .sector-card.active { border-color: rgba(var(--accent-rgb), 0.3); }
    .sector-card.active .chevron { transform: rotate(180deg); stroke: var(--accent); }
    .sector-content { max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0, 1, 0, 1); background: rgba(0, 0, 0, 0.1); }

    .task-item { display: flex; flex-direction
