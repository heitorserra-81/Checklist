<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Marchesini Live v13.0</title>
  <style>
    :root {
      --bg: #0b0c10;
      --surface-card: #14161d;
      --surface-nested: #1b1e26;
      --border-color: rgba(212, 175, 55, 0.12);
      --accent-gold: #c9a054;
      --accent-light: #f3e5ab;
      --text-main: #f3f4f6;
      --text-muted: #8e8e93;
      --color-success: #30d158;
      --color-danger: #ff453a;
      --color-process: #2f80ed;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background: radial-gradient(circle at top, #161923 0%, var(--bg) 100%); 
      color: var(--text-main); 
      padding: 24px 16px 140px 16px; 
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* TELA DE REGISTRO E LOGIN OPTIMIZADA */
    .login-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at top, #1c1f2b 0%, #050608 100%);
      z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;
      transition: opacity 0.4s ease; overflow-y: auto;
    }
    .login-box {
      background: var(--surface-card); border: 1px solid var(--border-color);
      padding: 32px 24px; border-radius: 24px; width: 100%; max-width: 350px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7); text-align: center;
    }
    .login-box h2 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .login-box p { font-size: 11px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
    
    .login-select {
      width: 100%; padding: 14px; background: rgba(255,255,255,0.03); 
      border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; 
      color: #fff; font-size: 15px; font-weight: 600; margin-bottom: 16px; outline: none;
    }
    .login-input-pass {
      width: 100%; padding: 14px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
      color: #fff; font-size: 15px; margin-bottom: 16px; text-align: center; letter-spacing: 4px;
    }

    /* CÂMERA E INSTANTÂNEO DE SELFIE */
    .camera-zone { margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .avatar-preview-box { width: 90px; height: 90px; border-radius: 50%; border: 2px dashed var(--accent-gold); overflow: hidden; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.3); position: relative; }
    .avatar-preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .avatar-preview-box span { font-size: 24px; }
    .btn-capture { background: rgba(255,255,255,0.05); border: 1px dashed var(--accent-gold); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; display: inline-block; }
    .photo-confirm-panel { display: none; gap: 10px; margin-top: 5px; }
    .btn-photo-action { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; }
    .btn-photo-redo { background: var(--color-danger); color: #fff; }
    .btn-photo-ok { background: var(--color-success); color: #000; }

    .btn-login {
      width: 100%; background: var(--accent-gold); color: #000; padding: 14px;
      border-radius: 14px; font-size: 15px; font-weight: 700; border: none; cursor: pointer;
      box-shadow: 0 4px 15px rgba(201, 160, 84, 0.3);
    }
    .login-error { color: var(--color-danger); font-size: 12px; margin-top: 12px; display: none; font-weight: 600; }

    /* CONTEÚDO PRINCIPAL */
    .app-container { display: none; }

    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface-card); border: 1px solid var(--border-color);
      padding: 16px 20px; border-radius: 20px; margin-bottom: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo-wrapper { width: 45px; height: 45px; }
    .app-logo { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; border: 1.5px solid var(--accent-gold); }
