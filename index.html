<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Marchesini Pro v9</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0d17 0%, #16192b 100%);
      --glass-card: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(199, 160, 84, 0.2);
      --accent: #d4af37; /* Ouro Premium */
      --accent-light: #f3e5ab;
      --text: #ffffff;
      --muted: #a0a5b5;
      --success: #2ed573;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background: var(--bg-gradient); 
      color: var(--text); 
      padding: 20px 16px 140px 16px; 
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Topo Layout Novo de Luxo */
    .app-header {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      padding: 20px;
      border-radius: 24px;
      margin-bottom: 24px;
      box-shadow: 0 15px 35px var(--shadow), inset 0 1px 2px rgba(255,255,255,0.1);
    }

    .logo-wrapper {
      position: relative;
      width: 60px;
      height: 60px;
      margin-right: 16px;
      cursor: pointer;
    }

    .app-logo {
      width: 100%;
      height: 100%;
      border-radius: 16px; /* Quadrado arredondado estilo App */
      object-fit: cover;
      border: 2px solid var(--accent);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .logo-hint {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: var(--accent);
      font-size: 8px;
      padding: 2px 4px;
      border-radius: 4px;
      color: #000;
      font-weight: 800;
    }

    .app-info h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #fff; }
    .app-info p { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 2px; }

    /* Card de Progresso Futurista */
    .progress-box {
      background: rgba(255, 255, 255, 0.01);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    .progress-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 10px; color: var(--accent-light); }
    .progress-bar-bg { background: rgba(0, 0, 0, 0.4); height: 8px; border-radius: 10px; overflow: hidden; pading: 1px; }
    .progress-bar-fill { background: linear-gradient(90deg, var(--accent), #ffd700, var(--success)); height: 100%; width: 0%; transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 0 12px var(--accent); }

    /* Seleção de Funcionários */
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 12px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; padding-left: 4px; }
    
    .team-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 4px 10px 4px; align-items: center; width: 100%; }
    .team-scroll::-webkit-scrollbar { display: none; }
    
    .team-card { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: all 0.3s ease; }
    .team-avatar { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); background: #1c1c24; transition: all 0.3s ease; }
    .team-name { font-size: 11px; font-weight: 600; color: var(--muted); }
    .team-card.active .team-avatar { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
    .team-card.active .team-name { color: #fff; font-weight: 700; }

    .btn-add-member { width: 54px; height: 54px; border-radius: 50%; border: 2px dashed var(--accent); background: transparent; color: var(--accent); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    /* Setores Estilo Premium Minimalista */
    .sector-card {
      background: var(--glass-card);
      border: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 22px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: border 0.3s;
    }
    .sector-card.active { border-color: var(--glass-border); }
    
    .sector-header { display: flex; align-items: center; padding: 18px 20px; cursor: pointer; }
    .sector-icon { width: 38px; height: 38px; background: rgba(255,255,255,0.03); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-right: 14px; border: 1px solid rgba(255,255,255,0.05); }
    .sector-details { flex: 1; }
    .sector-name { font-size: 15px; font-weight: 700; color: #fff; }
    .sector-qty { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .chevron { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 3; transition: transform 0.3s; }
    .sector-card.active .chevron { transform: rotate(180deg); stroke: var(--accent); }

    .sector-content { max-height: 0; overflow: hidden; transition: max-height 0.35s cubic-bezier(0.25, 1, 0.5, 1); }
    
    /* Itens de Tarefa Totalmente Novos */
    .task-item { 
      display: flex; 
      flex-direction: column;
      padding: 16px 20px; 
      border-top: 1px solid rgba(255,255,255,0.03); 
      background: rgba(0, 0, 0, 0.1);
    }
    
    .task-main-row { display: flex; align-items: center; width: 100%; cursor: pointer; }
    
    .check-round { 
      width: 22px; height: 22px; 
      border: 2px solid rgba(255,255,255,0.2); 
      border-radius: 6px; /* Quadrado sutil, estilo premium */
      margin-right: 14px; 
      flex-shrink: 0; 
      display: flex; align-items: center; justify-content: center; 
      transition: all 0.2s; 
    }
    
    .task-item.done .check-round { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px rgba(212, 175, 55, 0.4); }
    .task-item.done .check-round::after { content: "✓"; color: #000; font-size: 12px; font-weight: 900; }
    
    .task-label { font-size: 14px; flex: 1; color: #e1e3e6; font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .task-item.done .task-label span { text-decoration: line-through; color: var(--muted); opacity: 0.7; }

    .user-badge-premium { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 8px; background: rgba(212, 175, 55, 0.1); color: var(--accent); border: 1px solid rgba(212, 175, 55, 0.2); }

    /* Área de Foto por Tarefa (Novo!) */
    .task-photo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding-left: 36px;
      width: 100%;
    }
    .btn-task-camera {
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.2);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-task-camera:active { background: rgba(255,255,255,0.08); }
    
    .task-img-preview {
      width: 45px;
      height: 45px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--accent);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
      display: none;
      position: relative;
    }

    /* 🔥 TELA CHEIA: SUPER ANIMAÇÕES DE IMPACTO 🔥 */
    .animation-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 9, 15, 0.95);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    
    .anim-box {
      text-align: center;
      animation: zoomPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    .anim-art { font-size: 90px; margin-bottom: 20px; display: inline-block; position: relative; }
    .anim-title { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; margin-bottom: 6px; }
    .anim-subtitle { font-size: 13px; color: var(--accent); font-weight: 600; text-transform: uppercase; }

    @keyframes zoomPop {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    /* Efeito Pulo da Privada e do Pano */
    .jump-animation { animation: jmp 0.5s ease infinite alternate; }
    @keyframes jmp { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }
    
    .wipe-animation { animation: wp 0.6s ease infinite alternate; }
    @keyframes wp { 0% { transform: translateX(-15px) rotate(-10deg); } 100% { transform: translateX(15px) rotate(10deg); } }

    /* Modais e Botões de Ação */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 20px; }
    .modal-content { background: #131622; border: 1px solid var(--glass-border); padding: 24px; border-radius: 24px; width: 100%; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .modal-content h3 { margin-bottom: 16px; color: #fff; text-align: center; font-size: 18px; }
    .modal-input { width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 14px; margin-bottom: 16px; }
    .modal-btns { display: flex; gap: 10px; }
    .btn-m { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 13px; }
    .btn-m-save { background: var(--accent); color: #000; }
    .btn-m-cancel { background: rgba(255,255,255,0.05); color: #fff; }

    .footer-bar { position: fixed; bottom: 24px; left: 16px; right: 16px; display: flex; gap: 12px; z-index: 100; }
    .btn-action { flex: 1; border: none; padding: 16px; border-radius: 50px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; text-decoration: none; }
    .btn-clear { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); color: #ff453a; }
    .btn-send { background: #25d366; color: #fff; display: flex; align-items: center; justify-content: center; gap: 6px; }
  </style>
</head>
<body>

  <div class="animation-overlay" id="anim-overlay">
    <div class="anim-box">
      <div class="anim-art" id="anim-art">🚽👍</div>
      <div class="anim-title" id="anim-title">Tarefa Concluída!</div>
      <div class="anim-subtitle" id="anim-subtitle">Excelente trabalho!</div>
    </div>
  </div>

  <input type="file" id="logo-input" accept="image/*" style="display: none;" onchange="atualizarLogo(this)">

  <div class="app-header">
    <div class="logo-wrapper" onclick="document.getElementById('logo-input').click()">
      <img class="app-logo" id="restaurant-logo" src="https://images.unsplash.com/photo-1544025162-d76694265947?w=150" alt="Logo">
      <div class="logo-hint">Mudar</div>
    </div>
    <div class="app-info">
      <h1 id="restaurant-name">Marchesini di Roverbella</h1>
      <p>Módulo Operacional Premium</p>
    </div>
  </div>

  <div class="progress-box">
    <div class="progress-labels">
      <span>Progresso do Turno</span>
      <span id="progress-txt">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <div class="section-header-flex">
    <div class="section-title">Equipe do Turno</div>
  </div>
  
  <div class="team-scroll">
    <div id="team-container" style="display: flex; gap: 12px;"></div>
    <button class="btn-add-member" onclick="abrirModalCadastro()">➕</button>
  </div>

  <div class="section-title" style="margin: 20px 0 12px 4px;">Setores</div>
  <div id="sectors-container"></div>

  <div class="modal" id="cadastro-modal">
    <div class="modal-content">
      <h3>Novo Membro</h3>
      <input type="text" class="modal-input" id="new-member-name" placeholder="Nome do funcionário">
      <div class="modal-btns">
        <button class="btn-m btn-m-cancel" onclick="fecharModalCadastro()">Voltar</button>
        <button class="btn-m btn-m-save" onclick="salvarNovoMembro()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <button class="btn-action btn-clear" onclick="limparMesa()">Zerar</button>
    <a class="btn-action btn-send" id="whatsapp-btn" href="#" onclick="enviarRelatorio(event)">Enviar Relatório</a>
  </div>

  <script>
    var equipePadrao = [
      { nome: "Heitor", foto: "" },
      { nome: "Danilo", foto: "" },
      { nome: "Bill", foto: "" },
      { nome: "Aeby", foto: "" }
    ];

    var dadosSetores = [
      {
        id: "salao", title: "Salão & Área Externa", icon: "🛋️",
        tasks: [
          "Levar mesas e cadeiras para a área externa e alinhar.",
          "Varrer minuciosamente o salão principal e circulação.",
          "Baixar todas as cadeiras das mesas com cuidado.",
          "Passar pano com desinfetante no chão do salão.",
          "Higienizar a superfície das mesas com álcool 70%.",
          "Limpar detalhadamente os sousplats e jogos americanos.",
          "Montar as mesas (sousplat, pratos, talheres).",
          "Abastecer e alinhar as papeleiras e galheteiros."
        ]
      },
      {
        id: "buffet", title: "Buffet Self-Service", icon: "🍱",
        tasks: [
          "Limpar a pista quente e ligar o aquecimento.",
          "Limpar a pista fria e ligar a refrigeração.",
          "Organizar a mesa de candy e a bancada de cafés.",
          "Higienizar pegadores, conchas e utensílios.",
          "Abastecer pratos e talheres no início da rampa.",
          "Coordenar com a cozinha o abastecimento das cubas."
        ]
      },
      {
        id: "bar", title: "Bar & Bebidas", icon: "🍹",
        tasks: [
          "Varrer e passar pano no piso do bar.",
          "Recolher, esvaziar e higienizar as lixeiras do bar.",
          "Conferir e reabastecer o estoque de gelo.",
          "Abastecer geladeiras com cervejas, refris e sucos.",
          "Organizar, polir e alinhar copos e taças."
        ]
      },
      {
        id: "banheiros", title: "Banheiros", icon: "🧻",
        tasks: [
          "Lavar e desinfetar os vasos sanitários e pias.",
          "Repor rolos de papel higiênico nos suportes.",
          "Abastecer os dispensers de papel toalha.",
          "Verificar e abastecer os recipientes de sabonete.",
          "Limpar espelhos e passar pano perfumado no chão.",
          "Esvaziar e trocar os sacos plásticos das lixeiras."
        ]
      }
    ];

    var estado = JSON.parse(localStorage.getItem('marchesini_v9_state')) || {
      usuarioAtivo: "Heitor",
      equipe: equipePadrao,
      tarefasFeitas: {},
      fotosTarefas: {},
      logoRestaurante: ""
    };

    function salvarEstado() {
      localStorage.setItem('marchesini_v9_state', JSON.stringify(estado));
      atualizarProgresso();
    }

    function atualizarLogo(input) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          estado.logoRestaurante = e.target.result;
          document.getElementById('restaurant-logo').src = e.target.result;
          salvarEstado();
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function renderEquipe() {
      var container = document.getElementById('team-container');
      container.innerHTML = '';
      estado.equipe.forEach(function(membro) {
        var card = document.createElement('div');
        card.className = 'team-card' + (estado.usuarioAtivo === membro.nome ? ' active' : '');
        var letra = membro.nome.charAt(0).toUpperCase();
        var fotoSrc = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><rect width='50' height='50' fill='%23222535'/><text x='50%25' y='55%25' font-size='16' fill='%23d4af37' font-weight='bold' text-anchor='middle' dominant-baseline='middle'>"+letra+"</text></svg>";
        
        card.innerHTML = '<img class="team-avatar" src="' + fotoSrc + '"><div class="team-name">' + membro.nome + '</div>';
        card.onclick = function() {
          estado.usuarioAtivo = membro.nome;
          salvarEstado();
          renderEquipe();
        };
        container.appendChild(card);
      });
    }

    function abrirModalCadastro() { document.getElementById('cadastro-modal').style.display = 'flex'; }
    function fecharModalCadastro() { document.getElementById('cadastro-modal').style.display = 'none'; document.getElementById('new-member-name').value = ''; }
    function salvarNovoMembro() {
      var nome = document.getElementById('new-member-name').value.trim();
      if(!nome) return;
      estado.equipe.push({ nome: nome, foto: "" });
      estado.usuarioAtivo = nome;
      salvarEstado();
      renderEquipe();
      fecharModalCadastro();
    }

    // 🔥 ACIONADOR DA SUPER ANIMAÇÃO EM TELA CHEIA 🔥
    function dispararSuperAnimacao(textoTarefa) {
      var overlay = document.getElementById('anim-overlay');
      var art = document.getElementById('anim-art');
      var title = document.getElementById('anim-title');
      
      var t = textoTarefa.toLowerCase();
      art.className = "anim-art"; // Limpa classes
      
      if (t.includes('vaso') || t.includes('sanitário') || t.includes('privada') || t.includes('banheiro')) {
        art.innerText = "🚽✨👍";
        art.classList.add('jump-animation');
        title.innerText = "Vaso Higienizado!";
      } else if (t.includes('pano') || t.includes('varrer') || t.includes('vassoura') || t.includes('chão') || t.includes('piso')) {
        art.innerText = "🧹🧼✨";
        art.classList.add('wipe-animation');
        title.innerText = "Chão Brilhando!";
      } else {
        art.innerText = "🌟🏆✨";
        art.classList.add('jump-animation');
        title.innerText = "Tarefa Concluída!";
      }
      
      overlay.style.display = 'flex';
      setTimeout(function() {
        overlay.style.display = 'none';
      }, 1500); // 1.5 segundo em tela cheia e some automaticamente
    }

    // Captura e renderiza foto para CADA tarefa individualmente
    window.tirarFotoTarefa = function(input, chave) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          estado.fotosTarefas[chave] = e.target.result;
          salvarEstado();
          var imgElement = document.getElementById('img_prev_' + chave);
          imgElement.src = e.target.result;
          imgElement.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    };

    function montarPainel() {
      var container = document.getElementById('sectors-container');
      container.innerHTML = '';

      dadosSetores.forEach(function(setor) {
        var card = document.createElement('div');
        card.className = 'sector-card';
        card.id = 'card_' + setor.id;

        var header = document.createElement('div');
        header.className = 'sector-header';
        var prontas = contarFeitas(setor.id);

        header.innerHTML = '<div class="sector-icon">' + setor.icon + '</div>' +
                           '<div class="sector-details">' +
                             '<div class="sector-name">' + setor.title + '</div>' +
                             '<div class="sector-qty" id="qty_' + setor.id + '">' + prontas + ' de ' + setor.tasks.length + ' prontas</div>' +
                           '</div>' +
                           '<svg class="chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none"/></svg>';

        var content = document.createElement('div');
        content.className = 'sector-content';
        content.id = 'content_' + setor.id;

        setor.tasks.forEach(function(tarefa, idx) {
          var item = document.createElement('div');
          var chave = setor.id + '_' + idx;
          item.className = 'task-item' + (estado.tarefasFeitas[chave] ? ' done' : '');
          item.id = 'item_' + chave;
          
          var badgeHtml = '';
          if(estado.tarefasFeitas[chave]) {
            badgeHtml = '<span class="user-badge-premium">' + estado.tarefasFeitas[chave] + '</span>';
          }

          // HTML da linha da tarefa + linha de foto individual
          item.innerHTML = 
            '<div class="task-main-row" id="main_row_'+chave+'">' +
              '<div class="check-round"></div>' +
              '<div class="task-label"><span>' + tarefa + '</span><div id="badge_space_'+chave+'">' + badgeHtml + '</div></div>' +
            '</div>' +
            '<div class="task-photo-row">' +
              '<label class="btn-task-camera">' +
                '📸 Foto Real' +
                '<input type="file" accept="image/*" style="display:none;" onchange="tirarFotoTarefa(this, \''+chave+'\')">' +
              '</label>' +
              '<img class="task-img-preview" id="img_prev_'+chave+'">' +
            '</div>';

          // Evento de marcar a tarefa concluída
          item.querySelector('.task-main-row').onclick = function(e) {
            if(!estado.tarefasFeitas[chave]) {
              estado.tarefasFeitas[chave] = estado.usuarioAtivo;
              item.classList.add('done');
              document.getElementById('badge_space_'+chave).innerHTML = '<span class="user-badge-premium">' + estado.usuarioAtivo + '</span>';
              
              // Dispara o show da animação em tela cheia!
              dispararSuperAnimacao(tarefa);
            } else {
              delete estado.tarefasFeitas[chave];
              item.classList.remove('done');
              document.getElementById('badge_space_'+chave).innerHTML = '';
            }
            salvarEstado();
            var novasProntas = contarFeitas(setor.id);
            document.getElementById('qty_' + setor.id).innerText = novasProntas + ' de ' + setor.tasks.length + ' prontas';
          };
          
          content.appendChild(item);

          // Se já existia uma foto salva para essa tarefa na memória, carrega ela na hora
          setTimeout(function() {
            if(estado.fotosTarefas[chave]) {
              var imgElement = document.getElementById('img_prev_' + chave);
              if(imgElement) {
                imgElement.src = estado.fotosTarefas[chave];
                imgElement.style.display = 'block';
              }
            }
          }, 10);
        });

        card.appendChild(header);
        card.appendChild(content);
        container.appendChild(card);

        header.onclick = function() {
          var active = card.classList.contains('active');
          document.querySelectorAll('.sector-card').forEach(c => {
            c.classList.remove('active');
            c.querySelector('.sector-content').style.maxHeight = '0px';
          });
          if(!active) {
            card.classList.add('active');
            content.style.maxHeight = '2000px';
          }
        };
      });
    }

    function contarFeitas(setorId) {
      var s = dadosSetores.find(x => x.id === setorId);
      var c = 0;
      s.tasks.forEach((t, i) => { if(estado.tarefasFeitas[setorId + '_' + i]) c++; });
      return c;
    }

    function atualizarProgresso() {
      var total = 0; var feitas = 0;
      dadosSetores.forEach(function(s) {
        s.tasks.forEach(function(t, i) { total++; if(estado.tarefasFeitas[s.id + '_' + i]) feitas++; });
      });
      var pct = total > 0 ? Math.round((feitas / total) * 100) : 0;
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-txt').innerText = pct + '%';
    }

    function enviarRelatorio(e) {
      var msg = '✨ *' + document.getElementById('restaurant-name').innerText.toUpperCase() + '* ✨\n*Relatório Operacional Premium*\n\n';
      dadosSetores.forEach(function(s) {
        msg += '📌 *' + s.title.toUpperCase() + '*\n';
        s.tasks.forEach(function(t, i) {
          var chave = s.id + '_' + i;
          var por = estado.tarefasFeitas[chave];
          var temFoto = estado.fotosTarefas[chave] ? ' 📸(Foto ok)' : '';
          msg += (por ? '✅ ' : '❌ ') + t + (por ? ' (_' + por + '_' + temFoto + ')' : '') + '\n';
        });
        msg += '\n';
      });
      document.getElementById('whatsapp-btn').href = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(msg);
    }

    function limparMesa() {
      if(confirm('Zerar o turno atual?')) {
        estado.tarefasFeitas = {};
        estado.fotosTarefas = {};
        salvarEstado();
        montarPainel();
      }
    }

    if(estado.logoRestaurante) { document.getElementById('restaurant-logo').src = estado.logoRestaurante; }
    renderEquipe();
    montarPainel();
    atualizarProgresso();
  </script>
</body>
</html>
