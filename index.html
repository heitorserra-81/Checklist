<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Marchesini Pro v10.1</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0a0d1a 0%, #121526 100%);
      --glass-card: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(212, 175, 55, 0.25);
      --accent: #d4af37; /* Ouro Nobre */
      --accent-glow: rgba(212, 175, 55, 0.4);
      --text: #ffffff;
      --muted: #8fa0b5;
      --success: #2ecc71;
      --chat-bg: rgba(15, 18, 36, 0.95);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background: var(--bg-gradient); 
      color: var(--text); 
      padding: 20px 16px 280px 16px; /* Espaço para o chat fixo */
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Topo de Luxo */
    .app-header {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.01);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
    }
    .logo-wrapper { position: relative; width: 54px; height: 54px; margin-right: 14px; cursor: pointer; }
    .app-logo { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; border: 2px solid var(--accent); }
    .logo-hint { position: absolute; bottom: -4px; right: -4px; background: var(--accent); font-size: 8px; padding: 1px 4px; border-radius: 4px; color: #000; font-weight: 900; }
    .app-info h1 { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
    .app-info p { font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

    /* Barra de Progresso Fina Premium */
    .progress-box { background: rgba(0, 0, 0, 0.2); padding: 14px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.03); }
    .progress-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; margin-bottom: 8px; color: var(--muted); }
    .progress-bar-bg { background: rgba(255,255,255,0.05); height: 6px; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, var(--accent), var(--success)); height: 100%; width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px var(--accent-glow); }

    /* Seção de Equipe */
    .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin: 15px 0 10px 4px; }
    .section-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1.5px; }
    .btn-add-member { background: transparent; border: 1px dashed var(--accent); color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 6px; cursor: pointer; font-weight: 700; }

    .team-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 4px 10px 4px; width: 100%; }
    .team-scroll::-webkit-scrollbar { display: none; }
    
    .team-card { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; }
    .avatar-wrapper { position: relative; width: 56px; height: 56px; }
    
    /* Foto de Perfil ou Letras Redondinhas */
    .team-avatar, .team-avatar-placeholder { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); background: #16192e; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: var(--accent); }
    
    .team-name { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; white-space: nowrap; }
    
    /* Botão de foto de perfil corrigido */
    .btn-profile-cam { position: absolute; bottom: 0; right: 0; background: var(--accent); border: none; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 10; }
    
    .team-card.active .team-avatar, .team-card.active .team-avatar-placeholder { border-color: var(--accent); transform: scale(1.05); box-shadow: 0 0 12px var(--accent-glow); }
    .team-card.active .team-name { color: #fff; font-weight: 700; }

    /* Cards dos Setores */
    .sector-card { background: var(--glass-card); border: 1px solid rgba(255,255,255,0.04); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; margin-bottom: 12px; overflow: hidden; }
    .sector-card.active { border-color: rgba(212, 175, 55, 0.15); }
    .sector-header { display: flex; align-items: center; padding: 16px; cursor: pointer; }
    .sector-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.02); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; }
    .sector-details { flex: 1; }
    .sector-name { font-size: 14px; font-weight: 700; color: #fff; }
    .sector-qty { font-size: 11px; color: var(--muted); }
    .chevron { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 3; transition: transform 0.3s; }
    .sector-card.active .chevron { transform: rotate(180deg); stroke: var(--accent); }
    .sector-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
    
    /* Itens de Tarefa */
    .task-item { display: flex; flex-direction: column; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.02); background: rgba(0,0,0,0.08); }
    .task-main-row { display: flex; align-items: center; width: 100%; cursor: pointer; }
    .check-round { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 6px; margin-right: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .task-item.done .check-round { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    .task-item.done .check-round::after { content: "✓"; color: #000; font-size: 11px; font-weight: 900; }
    .task-label { font-size: 13px; flex: 1; color: #e5e9f0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .task-item.done .task-label span { text-decoration: line-through; color: var(--muted); opacity: 0.6; }
    .user-badge-premium { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(212, 175, 55, 0.1); color: var(--accent); border: 1px solid rgba(212, 175, 55, 0.2); display: flex; align-items: center; gap: 4px; }
    .user-badge-pic { width: 12px; height: 12px; border-radius: 50%; object-fit: cover; }

    /* Upload de Fotos Individuais da Tarefa */
    .task-photo-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding-left: 32px; }
    .btn-task-camera { background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.15); color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .task-img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--accent); display: none; }

    /* 🔥 SUPER ANIMAÇÕES CARTOON 🔥 */
    .animation-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 7, 15, 0.96); z-index: 2000; align-items: center; justify-content: center;
    }
    .anim-box { text-align: center; }
    .anim-title { font-size: 22px; font-weight: 900; color: #fff; margin-top: 20px; letter-spacing: -0.5px; }
    .anim-subtitle { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-top: 4px; }
    .cartoon-container { position: relative; width: 140px; height: 140px; margin: 0 auto; display: flex; align-items: center; justify-content: center; }
    .cartoon-emoji { font-size: 85px; line-height: 1; display: inline-block; }

    .cartoon-toilet-anim { animation: crazyToilet 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) infinite alternate; }
    @keyframes crazyToilet {
      0% { transform: scaleX(1.1) scaleY(0.85) translateY(15px); }
      40% { transform: scaleX(0.9) scaleY(1.15) translateY(-25px) rotate(-8deg); }
      70% { transform: scaleX(1) scaleY(1) translateY(-25px) rotate(8deg); }
      100% { transform: scaleX(1.05) scaleY(0.9) translateY(0) rotate(0deg); }
    }
    .cartoon-wipe-anim { animation: crazyWipe 0.5s ease-in-out infinite alternate; transform-origin: bottom center; }
    @keyframes crazyWipe {
      0% { transform: translateX(-35px) rotate(-25deg) scaleY(0.9); }
      100% { transform: translateX(35px) rotate(25deg) scaleY(1.1); }
    }
    .cartoon-star-anim { animation: crazyStar 0.4s ease-in-out infinite alternate; }
    @keyframes crazyStar { 0% { transform: scale(0.8) rotate(-15deg); } 100% { transform: scale(1.25) rotate(15deg); } }

    /* Modais */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 20px; }
    .modal-content { background: #131622; border: 1px solid var(--glass-border); padding: 24px; border-radius: 24px; width: 100%; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .modal-content h3 { margin-bottom: 16px; color: #fff; text-align: center; font-size: 18px; }
    .modal-input { width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 14px; margin-bottom: 16px; }
    .modal-btns { display: flex; gap: 10px; }
    .btn-m { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; border: none; cursor: pointer; font-size: 13px; text-align: center; }
    .btn-m-save { background: var(--accent); color: #000; }
    .btn-m-cancel { background: rgba(255,255,255,0.05); color: #fff; }

    /* 💬 CHAT DO TURNO CORRIGIDO 💬 */
    .chat-panel {
      position: fixed; bottom: 84px; left: 16px; right: 16px;
      background: var(--chat-bg); border: 1px solid var(--glass-border);
      border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; z-index: 150; overflow: hidden;
    }
    .chat-header { background: rgba(255,255,255,0.02); padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .chat-header h4 { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }
    .chat-messages { height: 110px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .chat-messages::-webkit-scrollbar { display: none; }
    .msg-bubble { font-size: 11px; padding: 6px 10px; border-radius: 10px; max-width: 85%; width: fit-content; line-height: 1.3; word-break: break-word; }
    .msg-received { background: rgba(255,255,255,0.06); align-self: flex-start; color: #f0f2f5; }
    .msg-sent { background: rgba(212,175,55,0.18); border: 1px solid rgba(212,175,55,0.2); align-self: flex-end; color: #fff; }
    .msg-author { font-weight: 800; font-size: 9px; color: var(--accent); margin-bottom: 2px; text-transform: uppercase; }
    .chat-footer { display: flex; padding: 8px; background: rgba(0,0,0,0.2); gap: 6px; border-top: 1px solid rgba(255,255,255,0.03); }
    .chat-input { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 8px 12px; color: #fff; font-size: 12px; }
    .chat-input:focus { outline: none; border-color: var(--accent); }
    .btn-chat-send { background: var(--accent); border: none; padding: 0 14px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; color: #000; }

    /* Barra de Botões Finais */
    .footer-bar { position: fixed; bottom: 20px; left: 16px; right: 16px; display: flex; gap: 10px; z-index
